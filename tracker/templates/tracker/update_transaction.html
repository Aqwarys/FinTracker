{% extends "base.html" %}
{% load static %}
{% block title %}Update Transaction{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Update Transaction</h2>

    <form method="POST" class="row g-3">
        {% csrf_token %}

        <!-- Operation Type (select) -->
        <div class="col-md-3">
            <label for="id_operation_type" class="form-label">Operation Type</label>
            <select class="form-control" id="id_operation_type" name="operation_type">
                <option value="Income" {% if form.initial.operation_type == 'income' %}selected{% endif %}>Income</option>
                <option value="Expense" {% if form.initial.operation_type == 'expense' %}selected{% endif %}>Expense</option>
            </select>
        </div>

        <!-- Amount -->
        <div class="col-md-3">
            <label for="id_amount" class="form-label">Amount</label>
            <input type="number" class="form-control" id="id_amount" name="amount" value="{{ form.initial.amount }}">
        </div>

        <!-- Category -->
        <div class="col-md-3">
            <label for="id_category" class="form-label">Category</label>
            <select class="form-select" id="id_category" name="category">
                {% for cat in form.fields.category.queryset %}
                    <option value="{{ cat.id }}" {% if form.initial.category.id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Date -->
        <div class="col-md-3">
            <label for="id_date" class="form-label">Date</label>
            <input type="date" class="form-control datepicker" id="id_date" name="date" value="{{ form.initial.date|date:'Y-m-d' }}">
        </div>

        <!-- Description -->
        <div class="col-12">
            <label for="id_description" class="form-label">Description</label>
            <input type="text" class="form-control" id="id_description" name="description" value="{{ form.initial.description }}">
        </div>

        <!-- Submit -->
        <div class="col-12 d-flex justify-content-between">
            <a href="{% url 'tracker:index' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
